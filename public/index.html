<!DOCTYPE html>
<html>
<head>
  <title>My Delivery App - Pay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial; text-align: center; padding: 30px;">
  <h1>🛵 Delivery App</h1>
  <p>Enter payment details to test M-Pesa STK Push</p>

  <div style="margin-bottom: 15px;">
    <input id="phone" type="tel" placeholder="Phone (e.g., 254708374149)" style="padding: 10px; width: 80%; max-width: 300px;">
  </div>
  
  <div style="margin-bottom: 15px;">
    <input id="amount" type="number" placeholder="Amount (e.g., 10)" style="padding: 10px; width: 80%; max-width: 300px;">
  </div>

  <button onclick="payNow()" style="padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px;">
    Pay with M-Pesa
  </button>

  <p id="result" style="color: green; font-weight: bold; margin-top: 20px;"></p>

  <script>
    async function payNow() {
      const phone = document.getElementById('phone').value;
      const amount = document.getElementById('amount').value;
      const result = document.getElementById('result');

      if (!phone || !amount) {
        result.style.color = 'red';
        result.innerText = "Please enter both phone and amount.";
        return;
      }

      result.style.color = 'blue';
      result.innerText = "Sending request... Please wait.";

      try {
        const response = await fetch('/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, amount })
        });

        const data = await response.json();
        
        if (data.success) {
          result.style.color = 'green';
          result.innerText = "✅ Request sent! Check your phone for the M-Pesa PIN prompt.";
        } else {
          result.style.color = 'red';
          result.innerText = "❌ Failed: " + (data.error || "Check the server logs.");
        }
      } catch (error) {
        result.style.color = 'red';
        result.innerText = "❌ Network error. Please try again.";
      }
    }
  </script>
</body>
</html>
