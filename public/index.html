<!DOCTYPE html>
<html>
<head>
  <title>Columbus Delivery - Order Now</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 0; background: linear-gradient(180deg, #0d2b45 0%, #1a4a6e 40%, #f4f4f9 40%, #f4f4f9 100%); min-height: 100vh; }
    .hero { text-align: center; color: white; padding: 30px 20px 50px; }
    .hero h1 { margin: 0 0 8px; font-size: 26px; }
    .hero p { margin: 0; font-size: 14px; opacity: 0.85; }
    .container { padding: 0 15px 40px; max-width: 520px; margin: auto; }
    .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #0d2b45; font-weight: 700; margin: 18px 0 10px; }
    .section-title:first-child { margin-top: 0; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #444; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e8; border-radius: 10px; font-size: 15px; background: #fafbfd; transition: 0.2s; font-family: inherit; }
    input:focus { outline: none; border-color: #0d2b45; background: white; }
    .form-group { margin-bottom: 14px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    
    .pin-btn { width: 100%; padding: 12px; background: #0d2b45; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .pin-btn.success { background: #27ae60; }
    .pin-status { font-size: 12px; color: #666; margin-top: 6px; text-align: center; }
    
    .summary { background: linear-gradient(135deg, #e8f0fe 0%, #d4e4fc 100%); border-radius: 12px; padding: 16px; margin-top: 16px; }
    .summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; color: #444; }
    .summary-row.total { font-size: 20px; font-weight: 700; color: #0d2b45; border-top: 2px dashed #b8c8e0; padding-top: 10px; margin-top: 10px; }
    .badge { background: #27ae60; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    
    .btn-pay { width: 100%; background: linear-gradient(135deg, #27ae60, #219a52); color: white; border: none; padding: 16px; font-size: 16px; font-weight: 700; border-radius: 12px; margin-top: 18px; cursor: pointer; box-shadow: 0 4px 12px rgba(39,174,96,0.3); }
    .btn-pay:active { transform: scale(0.98); }
    .result { text-align: center; font-weight: 600; margin-top: 15px; padding: 12px; border-radius: 10px; }
    .result.success { background: #d4edda; color: #155724; }
    .result.error { background: #f8d7da; color: #721c24; }
    .result.loading { background: #cce5ff; color: #004085; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>🛵 Columbus Delivery</h1>
    <p>Fast, reliable campus delivery</p>
  </div>
  
  <div class="container">
    <div class="card">
      <div class="section-title">📍 Location Details</div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Hostel Name *</label>
          <input id="hostel" type="text" placeholder="e.g. Mandela">
        </div>
        <div class="form-group">
          <label>Room Number *</label>
          <input id="room" type="text" placeholder="e.g. 10">
        </div>
      </div>

      <div class="form-group">
        <label>Pin Your Exact Location (Optional)</label>
        <button class="pin-btn" id="pinBtn" onclick="pinLocation()">📌 Tap to Pin My Location</button>
        <div class="pin-status" id="pinStatus">Rider will use this for accurate delivery</div>
      </div>

      <div class="form-group">
        <label>Extra Location Note (Optional)</label>
        <input id="locationPin" type="text" placeholder="e.g. Behind the main gate">
      </div>

      <div class="section-title">👤 Your Details</div>
      
      <div class="form-group">
        <label>Your Name *</label>
        <input id="customerName" type="text" placeholder="e.g. John Doe">
      </div>

      <div class="form-group">
        <label>Phone Number *</label>
        <input id="phone" type="tel" placeholder="e.g. 0712345678">
      </div>

      <div class="section-title">🛒 Order Details</div>

      <div class="form-group">
        <label>Shop Name *</label>
        <input id="shopName" type="text" placeholder="e.g. Keneth Kenray">
      </div>

      <div class="form-group">
        <label>What do you want? *</label>
        <input id="itemDescription" type="text" placeholder="e.g. Chapati (Bakery)">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Amount per Item (KES) *</label>
          <input id="goodsAmount" type="number" placeholder="20" oninput="calculateTotal()">
        </div>
        <div class="form-group">
          <label>Quantity *</label>
          <input id="quantity" type="number" placeholder="1" oninput="calculateTotal()">
        </div>
      </div>

      <div class="summary">
        <div class="summary-row">
          <span>Goods Total</span>
          <span id="goodsTotalDisplay">KES 0</span>
        </div>
        <div class="summary-row">
          <span>Delivery Fee <span class="badge">FIXED</span></span>
          <span>KES 10</span>
        </div>
        <div class="summary-row total">
          <span>Total to Pay</span>
          <span id="totalDisplay">KES 10</span>
        </div>
        <div style="font-size:11px; color:#666; margin-top:6px;">💰 You pay KES 10 now (delivery fee). Goods balance is paid on delivery.</div>
      </div>

      <button class="btn-pay" onclick="payDeliveryFee()">🔒 Pay KES 10 & Place Order</button>
      <div id="result" class="result" style="display:none;"></div>
    </div>
  </div>

  <script>
    const DELIVERY_FEE = 10;
    let userLatitude = null;
    let userLongitude = null;

    function pinLocation() {
      const btn = document.getElementById('pinBtn');
      const status = document.getElementById('pinStatus');

      if (!navigator.geolocation) {
        status.innerText = "❌ Location not supported on this device.";
        return;
      }

      status.innerText = "📡 Getting your location...";
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLatitude = position.coords.latitude;
          userLongitude = position.coords.longitude;
          btn.classList.add('success');
          btn.innerText = "✅ Location Pinned!";
          status.innerText = `📍 Lat: ${userLatitude.toFixed(5)}, Long: ${userLongitude.toFixed(5)}`;
          btn.disabled = false;
        },
        (error) => {
          status.innerText = "❌ Could not get location. Please enable GPS and try again.";
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function calculateTotal() {
      const goods = parseFloat(document.getElementById('goodsAmount').value) || 0;
      const quantity = parseFloat(document.getElementById('quantity').value) || 0;
      const goodsTotal = goods * quantity;
      const grandTotal = goodsTotal + DELIVERY_FEE;

      document.getElementById('goodsTotalDisplay').innerText = "KES " + goodsTotal;
      document.getElementById('totalDisplay').innerText = "KES " + grandTotal;
    }

    function showResult(message, type) {
      const result = document.getElementById('result');
      result.style.display = 'block';
      result.className = 'result ' + type;
      result.innerText = message;
    }

    async function payDeliveryFee() {
      const hostel = document.getElementById('hostel').value;
      const room = document.getElementById('room').value;
      const customerName = document.getElementById('customerName').value;
      const shopName = document.getElementById('shopName').value;
      const phone = document.getElementById('phone').value;
      const itemDescription = document.getElementById('itemDescription').value;
      const goodsAmount = document.getElementById('goodsAmount').value;
      const quantity = document.getElementById('quantity').value;
      const locationPin = document.getElementById('locationPin').value;

      if (!hostel || !room || !customerName || !shopName || !phone || !itemDescription || !goodsAmount || !quantity) {
        showResult("❌ Please fill in all required fields.", "error");
        return;
      }

      showResult("⏳ Sending M-Pesa request...", "loading");

      try {
        const response = await fetch('/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            phone, 
            amount: DELIVERY_FEE,
            orderDetails: { 
              hostel, room, customerName, shopName, itemDescription, 
              goodsAmount, quantity, locationPin, 
              latitude: userLatitude, longitude: userLongitude 
            }
          })
        });

        const data = await response.json();
        
        if (data.success) {
          showResult("✅ Order placed! Check your phone for the M-Pesa PIN prompt.", "success");
        } else {
          showResult("❌ Failed: " + (data.error || "Please check the server logs."), "error");
        }
      } catch (error) {
        showResult("❌ Network error. Please try again.", "error");
      }
    }
  </script>
</body>
</html>
