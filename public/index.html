<!DOCTYPE html>
<html>
<head>
  <title>Columbus Delivery - Order</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
    .header { background-color: #0d2b45; color: white; padding: 20px; text-align: center; font-size: 22px; font-weight: bold; }
    .container { padding: 15px; max-width: 600px; margin: auto; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #fafafa; }
    .total-box { background: #e6f0ff; border: 1px solid #0d2b45; border-radius: 8px; padding: 15px; text-align: center; margin-top: 15px; }
    .total-box h3 { margin: 0; color: #0d2b45; }
    .btn-pay { width: 100%; background-color: #27ae60; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer; }
    .result { text-align: center; font-weight: bold; margin-top: 15px; }
    .breakdown { font-size: 14px; color: #555; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="header">🛵 Columbus Delivery</div>
  
  <div class="container">
    <div class="card">
      <h2 style="margin-top:0; text-align:center;">📝 Order Details</h2>
      
      <div class="form-row">
        <div class="form-group">
          <label>Hostel Name *</label>
          <input id="hostel" type="text" placeholder="e.g. Mandela">
        </div>
        <div class="form-group">
          <label>Room Number *</label>
          <input id="room" type="text" placeholder="e.g. 10">
        </div>
      </div>

      <div class="form-group">
        <label>Your Name *</label>
        <input id="customerName" type="text" placeholder="e.g. John Doe">
      </div>

      <div class="form-group">
        <label>Shop Name *</label>
        <input id="shopName" type="text" placeholder="e.g. Keneth Kenray">
      </div>

      <div class="form-group">
        <label>Phone Number *</label>
        <input id="phone" type="tel" placeholder="e.g. 0712345678">
      </div>

      <div class="form-group">
        <label>Location Pin (Optional)</label>
        <input id="locationPin" type="text" placeholder="e.g. Behind the main gate">
      </div>

      <div class="form-group">
        <label>What do you want? *</label>
        <input id="itemDescription" type="text" placeholder="e.g. Chapati (Bakery)">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Amount for Goods (KES) *</label>
          <input id="goodsAmount" type="number" placeholder="20" oninput="calculateTotal()">
        </div>
        <div class="form-group">
          <label>Quantity *</label>
          <input id="quantity" type="number" placeholder="1" oninput="calculateTotal()">
        </div>
      </div>

      <div class="total-box">
        <h3 id="totalDisplay">Total: 0 KES</h3>
        <div class="breakdown">Delivery Fee: <b>10 KES</b> (Pay now)</div>
        <div class="breakdown">Goods: <span id="goodsTotalDisplay">0 KES</span> (Pay on delivery)</div>
      </div>

      <button class="btn-pay" onclick="payDeliveryFee()">🛵 Pay Delivery Fee & Approve Order</button>
      <p id="result" class="result"></p>
    </div>
  </div>

  <script>
    const DELIVERY_FEE = 10;

    function calculateTotal() {
      const goods = parseFloat(document.getElementById('goodsAmount').value) || 0;
      const quantity = parseFloat(document.getElementById('quantity').value) || 0;
      const goodsTotal = goods * quantity;
      const grandTotal = goodsTotal + DELIVERY_FEE;

      document.getElementById('totalDisplay').innerText = "Total: " + grandTotal + " KES";
      document.getElementById('goodsTotalDisplay').innerText = goodsTotal + " KES";
    }

    async function payDeliveryFee() {
      const hostel = document.getElementById('hostel').value;
      const room = document.getElementById('room').value;
      const customerName = document.getElementById('customerName').value;
      const shopName = document.getElementById('shopName').value;
      const phone = document.getElementById('phone').value;
      const itemDescription = document.getElementById('itemDescription').value;
      const goodsAmount = document.getElementById('goodsAmount').value;
      const quantity = document.getElementById('quantity').value;
      const locationPin = document.getElementById('locationPin').value;
      const result = document.getElementById('result');

      if (!hostel || !room || !customerName || !shopName || !phone || !itemDescription || !goodsAmount || !quantity) {
        result.style.color = 'red';
        result.innerText = "❌ Please fill in all required fields.";
        return;
      }

      result.style.color = 'blue';
      result.innerText = "Sending M-Pesa request for " + DELIVERY_FEE + " KES... Please wait.";

      try {
        const response = await fetch('/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            phone: phone, 
            amount: DELIVERY_FEE,
            // Send order details so the backend can save them if needed
            orderDetails: { hostel, room, customerName, shopName, itemDescription, goodsAmount, quantity, locationPin }
          })
        });

        const data = await response.json();
        
        if (data.success) {
          result.style.color = 'green';
          result.innerText = "✅ Order Approved! Check your phone for the M-Pesa PIN prompt to pay the delivery fee.";
        } else {
          result.style.color = 'red';
          result.innerText = "❌ Failed: " + (data.error || "Check the server logs.");
        }
      } catch (error) {
        result.style.color = 'red';
        result.innerText = "❌ Network error. Please try again.";
      }
    }
  </script>
</body>
</html>
