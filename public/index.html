<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Colombus Delivery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a2342">
  <style>
    :root {
      --navy: #0a2342; --navy2: #12325e; --blue: #4d90fe; --blue-d: #3a7bd5;
      --gold: #ffc107; --green: #27ae60; --bg: #f4f6f9; --ink: #1f2a3a; --mut: #6b7788;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); min-height: 100vh; color: var(--ink); overflow-x: hidden; }
    body.locked { overflow: hidden; }
    #landingPage { padding-bottom: 90px; }

    /* Hero */
    .hero-header { background: linear-gradient(160deg, var(--navy) 0%, var(--navy2) 100%); color: #fff; padding: calc(36px + env(safe-area-inset-top)) 22px 50px; text-align: center; border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; position: relative; overflow: hidden; }
    .hero-header::before, .hero-header::after { content: ""; position: absolute; border-radius: 50%; background: rgba(77,144,254,.16); }
    .hero-header::before { width: 220px; height: 220px; top: -90px; right: -70px; }
    .hero-header::after { width: 140px; height: 140px; bottom: -60px; left: -40px; background: rgba(255,193,7,.12); }
    .hero-header > * { position: relative; z-index: 1; }
    .hero-logo { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 18px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .hero-header h1 { font-size: 25px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 6px; }
    .hero-header p { font-size: 14px; color: #b9cbe6; }

    /* Actions */
    .main-actions { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; max-width: 500px; margin: -22px auto 0; position: relative; z-index: 2; }
    .btn-large-order { width: 100%; padding: 18px; background: var(--blue); color: #fff; border: none; border-radius: 16px; font-size: 19px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 10px 22px rgba(77,144,254,.38); transition: transform .15s, background .15s; }
    .btn-large-order:active { transform: scale(.98); background: var(--blue-d); }
    .btn-track { width: 100%; padding: 14px; background: #fff; color: var(--navy); border: 2px solid var(--gold); border-radius: 16px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; transition: transform .15s, background .15s; }
    .btn-track:active { transform: scale(.98); background: #fff8e1; }

    /* Steps */

    /* Popular */
    .section-title { max-width: 500px; margin: 0 auto; padding: 24px 20px 6px; font-size: 18px; font-weight: 800; color: var(--navy); }
    .horizontal-scroll { display: flex; overflow-x: auto; gap: 14px; padding: 10px 20px 14px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .scroll-item { min-width: 156px; width: 156px; border-radius: 16px; scroll-snap-align: start; overflow: hidden; background: #fff; box-shadow: 0 4px 14px rgba(10,35,66,.09); display: flex; flex-direction: column; }
    .scroll-item img { width: 100%; height: 124px; object-fit: cover; background: #e8edf4; display: block; }
    .scroll-item .item-name { padding: 10px 10px 6px; text-align: center; font-size: 13px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
    .btn-buy-item { margin: 0 10px 10px; padding: 9px; background: var(--green); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 12.5px; }
    .btn-buy-item:active { background: #219a52; }
    .empty-note { font-size: 13px; color: var(--mut); padding: 10px 0; }
    .skeleton { min-width: 156px; height: 196px; border-radius: 16px; background: linear-gradient(90deg, #e6ebf2 25%, #f1f4f8 50%, #e6ebf2 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* Footer (from admin settings) */
    .site-footer { max-width: 500px; margin: 10px auto 0; padding: 22px 20px 10px; text-align: center; }
    .site-footer .f-msg { font-size: 14px; font-weight: 600; color: var(--navy); overflow-wrap: anywhere; }
    .site-footer .f-contact { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    .site-footer .f-contact a { text-decoration: none; font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 999px; }
    .f-call { background: var(--navy); color: #fff; }
    .f-wa { background: #25d366; color: #fff; }
    .site-footer .f-copy { margin-top: 14px; font-size: 11px; color: #98a3b3; }

    /* Bottom nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 14px rgba(10,35,66,.08); z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #8592a5; gap: 3px; text-decoration: none; min-width: 64px; padding: 4px 0; }
    .nav-item.active { color: var(--navy); font-weight: 700; }
    .nav-item span { font-size: 21px; }

    /* Toast */
    .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(5,15,30,.6); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #fff; width: 100%; max-width: 500px; height: 92%; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden; animation: slideUp .3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { background: linear-gradient(160deg, var(--navy), var(--navy2)); color: #fff; padding: 16px; text-align: center; font-size: 17px; font-weight: 800; position: relative; }
    .close-modal { position: absolute; right: 12px; top: 10px; background: rgba(255,255,255,.14); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 22px; line-height: 1; cursor: pointer; }
    .modal-body { padding: 18px 18px 30px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
    .form-row { display: flex; gap: 10px; }
    .form-group { flex: 1; margin-bottom: 14px; min-width: 0; }
    .form-group label { display: block; font-size: 12.5px; font-weight: 700; color: var(--navy); margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1.5px solid #dde3ec; border-radius: 12px; font-size: 16px; background: #fafbfd; outline: none; color: var(--ink); }
    .form-group textarea { min-height: 70px; resize: vertical; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(77,144,254,.15); }

    .pin-btn { width: 100%; padding: 12px; background: #eaf3ff; color: var(--navy); border: 1.5px dashed var(--blue); border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .pin-btn.success { background: #e8f8f0; color: var(--green); border-color: var(--green); border-style: solid; }
    .pin-btn:disabled { opacity: .7; }
    .pin-status { font-size: 11.5px; color: var(--mut); text-align: center; margin-top: 6px; }

    .payment-options { background: #f6f8fb; border: 1.5px solid #e1e7f0; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .payment-options label { display: flex; align-items: center; gap: 10px; font-weight: 500; margin-bottom: 6px; cursor: pointer; color: var(--navy); font-size: 14px; }
    .payment-options input[type="radio"] { width: auto; transform: scale(1.35); margin-right: 4px; accent-color: var(--blue); }
    .option-desc { font-size: 11.5px; color: var(--mut); margin-left: 28px; margin-bottom: 12px; }

    .total-box { background: #eaf3ff; border: 2px solid var(--blue); border-radius: 14px; padding: 14px; text-align: center; margin: 18px 0; }
    .total-box h3 { color: var(--navy); font-size: 21px; }

    .btn-book-now { width: 100%; background: var(--blue); color: #fff; border: none; padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 800; cursor: pointer; margin-bottom: 14px; box-shadow: 0 8px 18px rgba(77,144,254,.3); }
    .btn-book-now:active { background: var(--blue-d); }
    .btn-book-now:disabled { background: #9aa8b4; cursor: not-allowed; box-shadow: none; }
    .btn-back-text { text-align: center; color: var(--mut); font-size: 14px; cursor: pointer; margin-bottom: 14px; display: block; text-decoration: none; }

    .result { text-align: center; font-weight: 700; margin-top: 6px; padding: 12px; border-radius: 12px; display: none; font-size: 14px; overflow-wrap: anywhere; }
    .result.success { background: #d4edda; color: #155724; display: block; }
    .result.error { background: #f8d7da; color: #721c24; display: block; }
    .result.loading { background: #cce5ff; color: #004085; display: block; }
    .result.warning { background: #fff8e1; color: #7f5f00; display: block; }
  </style>
</head>
<body>

  <div id="landingPage">
    <div class="hero-header">
      <div class="hero-logo">🚚</div>
      <h1>Welcome to Colombus Delivery</h1>
    </div>

    <div class="main-actions">
      <button class="btn-large-order" onclick="openModal()">🛒 Order Now</button>
      <a href="/track.html" class="btn-track">📦 Track My Order</a>
    </div>

    <div class="section-title">Popular Items</div>
    <div class="horizontal-scroll" id="featuredScroll">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>

    <footer class="site-footer" id="siteFooter">
      <div class="f-msg" id="footerMessage"></div>
      <div class="f-contact" id="footerContact"></div>
      <div class="f-copy">© Colombus Delivery</div>
    </footer>

    <div class="bottom-nav">
      <a href="#" class="nav-item active" onclick="window.scrollTo({top:0});return false;"><span>🏠</span>Home</a>
      <a href="#" class="nav-item" onclick="showToast('Saved items coming soon');return false;"><span>🤍</span>Saved</a>
      <a href="#" class="nav-item" onclick="showToast('Order history coming soon');return false;"><span>🕒</span>History</a>
      <a href="/track.html" class="nav-item"><span>📦</span>Track</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ORDER MODAL -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>📝</span> Order Details
        <button class="close-modal" onclick="closeModal()" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group"><label>Hostel *</label><input id="hostel" type="text" placeholder="e.g. Mandela"></div>
          <div class="form-group"><label>Room *</label><input id="room" type="text" placeholder="e.g. 10"></div>
        </div>

        <div class="form-group">
          <label>Pin Exact Location (Optional)</label>
          <button class="pin-btn" id="pinBtn" onclick="pinLocation()">📍 Tap to Pin My Location</button>
          <div class="pin-status" id="pinStatus">Helps the rider find you faster</div>
        </div>

        <div class="form-group"><label>Your Name *</label><input id="customerName" type="text" placeholder="e.g. John Doe"></div>
        <div class="form-group"><label>Shop Name *</label><input id="shopName" type="text" value="Any Shop"></div>
        <div class="form-group"><label>Phone Number *</label><input id="phone" type="tel" placeholder="e.g. 0712345678"></div>
        <div class="form-group"><label>What do you want? *</label><textarea id="itemDescription">General Order</textarea></div>

        <div class="form-row">
          <div class="form-group"><label>Total Cost of Goods (KES) *</label><input id="goodsAmount" type="number" value="0" oninput="calculateTotal()"></div>
          <div class="form-group"><label>Quantity *</label><input id="quantity" type="number" value="1" oninput="calculateTotal()"></div>
        </div>

        <div class="payment-options">
          <label>
            <input type="radio" name="paymentOption" value="delivery_only" checked onchange="calculateTotal()">
            <span>Pay <b id="deliveryFeeLabel">KES 10</b> delivery fee only</span>
          </label>
          <div class="option-desc">You will pay for the goods to the rider in cash</div>

          <label style="margin-bottom:0;">
            <input type="radio" name="paymentOption" value="full_payment" onchange="calculateTotal()">
            <span>Pay <b id="fullPaymentLabel">KES 10</b> full total now</span>
          </label>
          <div class="option-desc" style="margin-bottom:0;">Everything is paid upfront via M-Pesa.</div>
        </div>

        <div class="total-box"><h3>💰 You Pay Now: <span id="totalDisplay">10</span> KES</h3></div>

        <button class="btn-book-now" id="payBtn" onclick="payDeliveryFee()">✅ Order Items Now</button>
        <a class="btn-back-text" onclick="closeModal()">← Back</a>
        <div id="result" class="result"></div>
      </div>
    </div>
  </div>

  <script>
    let DELIVERY_FEE = 10;
    let userLatitude = null;
    let userLongitude = null;
    let pollInterval = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function openModal() {
      document.getElementById('orderModal').classList.add('active');
      document.body.classList.add('locked');
      let savedDetails = null;
      try { savedDetails = JSON.parse(localStorage.getItem('customerDetails')); } catch (e) {}
      if (savedDetails) {
        document.getElementById('hostel').value = savedDetails.hostel || '';
        document.getElementById('room').value = savedDetails.room || '';
        document.getElementById('customerName').value = savedDetails.customerName || '';
        document.getElementById('phone').value = savedDetails.phone || '';
      }
      loadSettings(); // pick up any fee change made by admin
    }

    function closeModal() {
      document.getElementById('orderModal').classList.remove('active');
      document.body.classList.remove('locked');
    }

    // GPS location: tries high accuracy first, then falls back to network location
    function pinLocation() {
      const btn = document.getElementById('pinBtn');
      const status = document.getElementById('pinStatus');

      if (!navigator.geolocation) {
        status.innerText = "❌ Location not supported on this device.";
        return;
      }

      status.innerText = "📡 Getting your location...";
      btn.disabled = true;

      function ok(position) {
        userLatitude = position.coords.latitude;
        userLongitude = position.coords.longitude;
        btn.classList.add('success');
        btn.innerText = "✅ Location Pinned! (tap to refresh)";
        status.innerText = `📍 Lat: ${userLatitude.toFixed(5)}, Long: ${userLongitude.toFixed(5)}`;
        btn.disabled = false;
      }
      function fail(error) {
        btn.disabled = false;
        if (error && error.code === 1) {
          status.innerText = "❌ Location permission denied. Allow Location for this app in phone Settings, then tap again.";
        } else {
          status.innerText = "❌ Could not get location. Turn ON your phone GPS, go near a window, and tap again.";
        }
      }

      navigator.geolocation.getCurrentPosition(
        ok,
        (error) => {
          if (error && error.code === 1) return fail(error);
          status.innerText = "📡 Trying again with network location...";
          navigator.geolocation.getCurrentPosition(ok, fail, { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function calculateTotal() {
      const goods = parseFloat(document.getElementById('goodsAmount').value) || 0;
      const quantity = parseFloat(document.getElementById('quantity').value) || 0;
      const goodsTotal = goods * quantity;
      const grandTotal = goodsTotal + DELIVERY_FEE;

      document.getElementById('deliveryFeeLabel').innerText = "KES " + DELIVERY_FEE;
      document.getElementById('fullPaymentLabel').innerText = "KES " + grandTotal;

      const paymentOption = document.querySelector('input[name="paymentOption"]:checked').value;
      const totalBox = document.getElementById('totalDisplay');
      const payBtn = document.getElementById('payBtn');

      if (paymentOption === 'delivery_only') {
        totalBox.innerText = DELIVERY_FEE;
        if (!payBtn.disabled) payBtn.innerText = `✅ Pay KES ${DELIVERY_FEE} & Place Order`;
      } else {
        totalBox.innerText = grandTotal;
        if (!payBtn.disabled) payBtn.innerText = `✅ Pay KES ${grandTotal} & Place Order`;
      }
    }

    function showResult(msg, type) {
      const res = document.getElementById('result');
      res.className = 'result ' + type;
      res.innerText = msg;
    }

    function startPolling(orderId, amountToCharge) {
      let elapsed = 0;
      if (pollInterval) clearInterval(pollInterval);

      pollInterval = setInterval(async () => {
        elapsed += 3;
        try {
          const res = await fetch('/api/order-status/' + orderId);
          const data = await res.json();

          if (data.success && data.status === 'Paid') {
            clearInterval(pollInterval);
            showResult(`✅ Payment Confirmed! You paid KES ${amountToCharge}. Your order is placed.`, "success");
            document.getElementById('payBtn').innerText = "✅ Order Placed";
          } else if (data.success && data.status === 'Failed') {
            clearInterval(pollInterval);
            showResult(`❌ You failed to pay. There will be no delivery 🚚. Please try again.`, "error");
            document.getElementById('payBtn').disabled = false;
            calculateTotal();
          } else if (elapsed >= 90) {
            clearInterval(pollInterval);
            showResult(`⏱️ No response from M-Pesa. If you didn't enter your PIN, your order was NOT placed. Please try again.`, "warning");
            document.getElementById('payBtn').disabled = false;
            calculateTotal();
          }
        } catch (e) { console.error(e); }
      }, 3000);
    }

    async function payDeliveryFee() {
      const hostel = document.getElementById('hostel').value;
      const room = document.getElementById('room').value;
      const customerName = document.getElementById('customerName').value;
      const shopName = document.getElementById('shopName').value;
      const phone = document.getElementById('phone').value;
      const itemDescription = document.getElementById('itemDescription').value;
      const goodsAmount = document.getElementById('goodsAmount').value;
      const quantity = document.getElementById('quantity').value;
      const paymentOption = document.querySelector('input[name="paymentOption"]:checked').value;

      if (!hostel || !room || !customerName || !phone || !goodsAmount) {
        showResult("Please fill in all required fields.", "error"); return;
      }

      // Save details for next time
      localStorage.setItem('customerDetails', JSON.stringify({ hostel, room, customerName, phone }));

      const goodsTotal = (parseFloat(goodsAmount) || 0) * (parseFloat(quantity) || 0);
      const amountToCharge = paymentOption === 'full_payment' ? (goodsTotal + DELIVERY_FEE) : DELIVERY_FEE;

      const payBtn = document.getElementById('payBtn');
      payBtn.disabled = true; payBtn.innerText = "⏳ Processing...";
      showResult("Sending M-Pesa prompt...", "loading");

      try {
        const response = await fetch('/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone,
            amount: amountToCharge,
            paymentOption: paymentOption,
            orderDetails: {
              hostel, room, customerName, shopName, itemDescription,
              goodsAmount, quantity, phone,
              latitude: userLatitude, longitude: userLongitude
            }
          })
        });

        const data = await response.json();

        if (data.success && data.orderId) {
          startPolling(data.orderId, amountToCharge);
        } else {
          showResult("❌ Failed to send prompt. Try again.", "error");
          payBtn.disabled = false; calculateTotal();
        }
      } catch (error) {
        showResult("❌ Network error. Please try again.", "error");
        payBtn.disabled = false; calculateTotal();
      }
    }

    // Keep the order sheet above the on-screen keyboard
    (function () {
      const ov = document.getElementById('orderModal');
      const vv = window.visualViewport;
      function fit() {
        if (!vv) return;
        ov.style.height = vv.height + 'px';
        ov.style.top = vv.offsetTop + 'px';
        const a = document.activeElement;
        if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && ov.contains(a)) {
          setTimeout(() => a.scrollIntoView({ block: 'center', behavior: 'smooth' }), 80);
        }
      }
      if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
      ov.addEventListener('focusin', () => setTimeout(fit, 300));
      ov.addEventListener('focusout', () => setTimeout(() => {
        if (!ov.contains(document.activeElement)) { ov.style.height = ''; ov.style.top = ''; }
      }, 100));
    })();

    // ---------- Admin settings (delivery fee, footer, featured items) ----------
    function renderFooter(s) {
      const msg = (s.footerMessage || '').toString().trim();
      document.getElementById('footerMessage').innerText = msg;
      document.getElementById('footerMessage').style.display = msg ? '' : 'none';

      const box = document.getElementById('footerContact');
      box.innerHTML = '';
      const raw = (s.contactPhone || '').toString().trim();
      const digits = raw.replace(/[^\d]/g, '');
      if (digits.length >= 9) {
        const intl = digits.startsWith('254') ? digits : '254' + digits.replace(/^0/, '');
        const call = document.createElement('a');
        call.className = 'f-call'; call.href = 'tel:' + (raw.startsWith('+') ? '+' + digits : digits);
        call.innerText = '📞 ' + raw;
        const wa = document.createElement('a');
        wa.className = 'f-wa'; wa.href = 'https://wa.me/' + intl; wa.target = '_blank'; wa.rel = 'noopener';
        wa.innerText = '💬 WhatsApp';
        box.appendChild(call); box.appendChild(wa);
      }
    }

    function renderFeatured(items) {
      const container = document.getElementById('featuredScroll');
      container.innerHTML = '';
      if (!items.length) {
        const p = document.createElement('p');
        p.className = 'empty-note'; p.innerText = 'No items available yet.';
        container.appendChild(p);
        return;
      }
      const fallback = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="150" height="124"><rect width="100%" height="100%" fill="#e8edf4"/><text x="50%" y="55%" font-size="34" text-anchor="middle">🛍️</text></svg>');
      items.forEach(item => {
        const name = (item && item.name) ? String(item.name) : '';
        const card = document.createElement('div'); card.className = 'scroll-item';
        const img = document.createElement('img');
        img.alt = name; img.loading = 'lazy';
        img.onerror = function () { this.onerror = null; this.src = fallback; };
        img.src = (item && item.imageUrl) ? item.imageUrl : fallback;
        const nm = document.createElement('div'); nm.className = 'item-name'; nm.innerText = name;
        const btn = document.createElement('button'); btn.className = 'btn-buy-item'; btn.innerText = '🛒 Buy';
        btn.onclick = function () { document.getElementById('itemDescription').value = name; openModal(); };
        card.appendChild(img); card.appendChild(nm); card.appendChild(btn);
        container.appendChild(card);
      });
    }

    function loadSettings() {
      return fetch('/api/settings/public', { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            DELIVERY_FEE = Number(data.settings.deliveryFee) || 10;
            renderFeatured(data.settings.featuredItems || []);
            renderFooter(data.settings);
            calculateTotal();
          }
        })
        .catch(e => {
          console.error(e);
          const c = document.getElementById('featuredScroll');
          if (c.querySelector('.skeleton')) {
            c.innerHTML = '<p class="empty-note">Could not load items. Pull to refresh.</p>';
          }
        });
    }

    // Load on page load, and refresh when the customer comes back to the app
    loadSettings();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadSettings(); });
    calculateTotal();
  </script>
</body>
</html>
