<!DOCTYPE html>
<html>
<head>
  <title>Columbus Delivery - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #f5f2eb; min-height: 100vh; color: #2c2c2c; padding-bottom: 40px; }
    .header { background: linear-gradient(180deg, #0a2342 0%, #1a3a5c 100%); color: #fff; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #d4af37; position: sticky; top: 0; z-index: 100; }
    .header-title { font-size: 18px; letter-spacing: 3px; font-weight: normal; text-transform: uppercase; }
    .header-title span { color: #d4af37; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .live-dot { display: inline-block; width: 8px; height: 8px; background: #4caf50; border-radius: 50%; margin-right: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-badge { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-family: Arial, sans-serif; }
    .btn-icon { background: transparent; border: 1px solid #d4af37; color: #d4af37; padding: 6px 12px; border-radius: 3px; font-size: 11px; letter-spacing: 1px; cursor: pointer; text-decoration: none; font-family: Arial, sans-serif; text-transform: uppercase; }
    .btn-icon:hover { background: #d4af37; color: #0a2342; }
    
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; max-width: 700px; margin: 0 auto; }
    .stat-card { background: #fff; border-radius: 4px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(10, 35, 66, 0.08); border-top: 3px solid #d4af37; }
    .stat-card .num { font-size: 26px; font-weight: bold; color: #0a2342; font-family: Georgia, serif; }
    .stat-card .lbl { font-size: 10px; color: #888; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; font-family: Arial, sans-serif; }
    .stat-card.green .num { color: #2e7d32; }
    .stat-card.orange .num { color: #c47a00; }
    .stat-card.blue { border-top-color: #1565c0; }
    .stat-card.blue .num { color: #1565c0; }

    .manage-items { background: #fff; margin: 0 16px 16px; border-radius: 4px; padding: 16px; max-width: 700px; margin-left: auto; margin-right: auto; box-shadow: 0 2px 8px rgba(10, 35, 66, 0.08); border-left: 4px solid #1565c0; }
    .manage-items h3 { color: #0a2342; font-size: 14px; margin-bottom: 12px; font-family: Arial, sans-serif; text-transform: uppercase; letter-spacing: 1px; }
    .item-input-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #ccc; }
    .item-input-row input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; font-family: Arial, sans-serif; }
    .item-input-row input[type="file"] { font-size: 12px; font-family: Arial, sans-serif; }
    .img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; border: 1px solid #ccc; display: none; margin-top: 5px; }
    .btn-save-items { width: 100%; background: #1565c0; color: white; border: none; padding: 10px; border-radius: 3px; font-weight: bold; cursor: pointer; margin-top: 8px; font-family: Arial, sans-serif; }
    .btn-save-items:hover { background: #0d47a1; }
    
    .controls { padding: 0 16px 12px; max-width: 700px; margin: 0 auto; }
    .search-box { width: 100%; padding: 12px 14px; border: 1px solid #d8d2c2; border-radius: 3px; font-size: 14px; background: #fdfcf8; font-family: Georgia, serif; margin-bottom: 10px; }
    .search-box:focus { outline: none; border-color: #d4af37; background: #fff; }
    .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .filter-btn { padding: 6px 14px; border: 1px solid #d8d2c2; background: #fdfcf8; border-radius: 3px; font-size: 11px; font-weight: 600; color: #666; cursor: pointer; white-space: nowrap; letter-spacing: 1px; text-transform: uppercase; font-family: Arial, sans-serif; }
    .filter-btn.active { background: #0a2342; color: #d4af37; border-color: #0a2342; }
    
    #ordersContainer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 20px; max-width: 700px; margin: 0 auto; }
    .order-card { background: #fff; border-radius: 4px; padding: 14px; box-shadow: 0 2px 8px rgba(10, 35, 66, 0.08); border-left: 4px solid #f39c12; font-size: 12px; display: flex; flex-direction: column; justify-content: space-between; }
    .order-card.Paid { border-left-color: #2e7d32; }
    .order-card.Failed { border-left-color: #c62828; }
    .order-card.OutforDelivery { border-left-color: #1565c0; }
    .order-card.Delivered { border-left-color: #6a1b9a; }
    .order-card .ref { font-size: 10px; color: #999; letter-spacing: 1px; font-family: Arial, sans-serif; text-transform: uppercase; margin-bottom: 6px; }
    .order-card .customer { font-size: 14px; font-weight: bold; color: #0a2342; margin-bottom: 4px; font-family: Georgia, serif; }
    .order-card .row { margin-bottom: 4px; line-height: 1.4; color: #555; font-family: Arial, sans-serif; }
    .order-card .row b { color: #0a2342; }
    .order-card .divider { height: 1px; background: #e8e3d6; margin: 8px 0; }
    
    .status { display: inline-block; padding: 3px 10px; border-radius: 2px; font-size: 10px; font-weight: bold; color: #fff; letter-spacing: 1px; text-transform: uppercase; font-family: Arial, sans-serif; }
    .status.Pending { background-color: #c47a00; }
    .status.Paid { background-color: #2e7d32; }
    .status.Failed { background-color: #c62828; }
    .status.OutforDelivery { background-color: #1565c0; }
    .status.Delivered { background-color: #6a1b9a; }
    
    .map-link { display: inline-block; background: #1565c0; color: #fff !important; text-decoration: none; padding: 5px 10px; border-radius: 2px; font-size: 10px; font-weight: bold; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; font-family: Arial, sans-serif; }
    
    .action-buttons { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
    .action-buttons button { padding: 8px 10px; border: none; border-radius: 3px; color: #fff; font-size: 10px; font-weight: bold; cursor: pointer; width: 100%; letter-spacing: 1px; text-transform: uppercase; font-family: Arial, sans-serif; transition: 0.2s; }
    .action-buttons button:hover { opacity: 0.9; }
    .btn-whatsapp { background: #25d366; }
    .btn-out { background: #1565c0; }
    .btn-deliver { background: #6a1b9a; }
    .btn-delete { background: #c62828; }
    .no-orders { text-align: center; grid-column: span 2; padding: 40px; color: #888; background: #fff; border-radius: 4px; font-family: Arial, sans-serif; letter-spacing: 1px; }
    @media (max-width: 400px) { #ordersContainer { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">Columbus <span>Admin</span></div>
    <div class="header-actions">
      <span class="status-badge"><span class="live-dot"></span>Live</span>
      <a href="/settings.html" class="btn-icon">⚙️</a>
      <button class="btn-icon" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="num" id="statToday">0</div><div class="lbl">Orders Today</div></div>
    <div class="stat-card orange"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div>
    <div class="stat-card green"><div class="num" id="statRevenue">KES 0</div><div class="lbl">Today Fees</div></div>
    <div class="stat-card blue"><div class="num" id="statVisits">0</div><div class="lbl">👀 Visitors Today</div></div>
  </div>

  <div class="manage-items">
    <h3>🖼️ Manage Homepage Items (Max 5)</h3>
    <div id="featuredItemsContainer"></div>
    <button class="btn-save-items" onclick="saveFeaturedItems()">Save Homepage Items</button>
    <div id="saveStatus" style="text-align:center; font-size:12px; color:green; margin-top:8px;"></div>
  </div>

  <div class="controls">
    <input type="text" class="search-box" id="searchBox" placeholder="Search by name, phone, shop..." oninput="applyFilters()">
    <div class="filters">
      <button class="filter-btn active" data-filter="All" onclick="setFilter(this)">All</button>
      <button class="filter-btn" data-filter="Pending" onclick="setFilter(this)">Pending</button>
      <button class="filter-btn" data-filter="Paid" onclick="setFilter(this)">Paid</button>
      <button class="filter-btn" data-filter="OutforDelivery" onclick="setFilter(this)">Out</button>
      <button class="filter-btn" data-filter="Delivered" onclick="setFilter(this)">Delivered</button>
      <button class="filter-btn" data-filter="Failed" onclick="setFilter(this)">Failed</button>
    </div>
  </div>

  <div id="ordersContainer">Loading orders...</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const container = document.getElementById('ordersContainer');
    let allOrders = [];
    let currentFilter = 'All';

    // --- FEATURED ITEMS & UPLOAD LOGIC ---
    async function loadFeaturedItems() {
      try {
        const res = await fetch('/api/settings');
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        const data = await res.json();
        
        let items = data.settings?.featuredItems || [];
        while (items.length < 5) items.push({ imageUrl: '', name: '' });

        const container = document.getElementById('featuredItemsContainer');
        container.innerHTML = '';
        
        items.slice(0, 5).forEach((item, i) => {
          container.innerHTML += `
            <div class="item-input-row">
              <input type="text" id="itemName${i}" placeholder="Item Name (e.g. Chapati)" value="${item.name || ''}">
              <input type="hidden" id="itemImg${i}" value="${item.imageUrl || ''}">
              
              <label style="font-size:11px; color:#555; font-family:Arial;">Upload Photo:</label>
              <input type="file" accept="image/*" onchange="handleImageUpload(event, ${i})">
              
              <img id="preview${i}" src="${item.imageUrl || ''}" class="img-preview" style="${item.imageUrl ? 'display:block;' : ''}">
            </div>
          `;
        });
      } catch (e) { console.error(e); }
    }

    // 👇 NEW: Compress Image to prevent "File too large" errors
    function handleImageUpload(event, index) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // Compress image using canvas
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 500; // Resize to max 500px wide
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          // Convert to highly compressed JPEG base64
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
          
          document.getElementById(`itemImg${index}`).value = compressedBase64;
          const preview = document.getElementById(`preview${index}`);
          preview.src = compressedBase64;
          preview.style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveFeaturedItems() {
      const status = document.getElementById('saveStatus');
      status.innerText = "Saving...";
      status.style.color = "blue";

      const newItems = [];
      for (let i = 0; i < 5; i++) {
        const name = document.getElementById(`itemName${i}`).value.trim();
        const img = document.getElementById(`itemImg${i}`).value;
        if (name && img) {
          newItems.push({ name: name, imageUrl: img });
        }
      }

      try {
        const res = await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ featuredItems: newItems })
        });
        
        if (res.ok) {
          status.innerText = "✅ Saved successfully!";
          status.style.color = "green";
          setTimeout(() => status.innerText = "", 3000);
        } else {
          status.innerText = "❌ Failed to save.";
          status.style.color = "red";
        }
      } catch (error) {
        status.innerText = "❌ Network error.";
        status.style.color = "red";
      }
    }

    // --- ORDER LOGIC ---
    function handleAuthError(response) {
      if (response.status === 401) { window.location.href = '/login.html'; return true; }
      return false;
    }

    function formatPhoneForWhatsApp(phone) {
      let p = String(phone).replace(/\D/g, '');
      if (p.startsWith('0')) p = '254' + p.substring(1);
      else if (p.startsWith('254')) {}
      else if (p.length === 9) p = '254' + p;
      return p;
    }

    function buildWhatsAppMessage(order, type) {
      const ref = order._id.slice(-6);
      const goodsTotal = order.goodsAmount;
      if (type === 'confirm') return `Hi ${order.customerName}! 👋\n\nYour order #${ref} has been received by Columbus Delivery.\n\n📦 Item: ${order.itemDescription}\n💰 Goods: KES ${goodsTotal}\n🚚 Delivery Fee: KES ${order.deliveryFee} (paid ✅)`;
      if (type === 'out') return `Hi ${order.customerName}! 🛵\n\nYour order #${ref} is OUT FOR DELIVERY!\n\nPlease have KES ${goodsTotal} ready for the goods. 💰`;
      if (type === 'delivered') return `Hi ${order.customerName}! ✅\n\nYour order #${ref} has been delivered.\n\nThank you! 🛵`;
      return `Hi ${order.customerName}, about your order #${ref}...`;
    }

    async function loadOrders() {
      try {
        const response = await fetch('/api/orders');
        if (handleAuthError(response)) return;
        const data = await response.json();
        if (data.success) { allOrders = data.orders; updateStats(); applyFilters(); }
      } catch (error) { container.innerHTML = "<p class='no-orders'>Network error.</p>"; }
    }

    function updateStats() {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      let todayCount = 0; let pendingCount = 0; let todayRevenue = 0;
      allOrders.forEach(o => {
        if (new Date(o.createdAt) >= today) {
          todayCount++;
          if (['Paid', 'Out for Delivery', 'Delivered'].includes(o.status)) todayRevenue += o.deliveryFee || 0;
        }
        if (['Pending', 'Paid'].includes(o.status)) pendingCount++;
      });
      document.getElementById('statToday').innerText = todayCount;
      document.getElementById('statPending').innerText = pendingCount;
      document.getElementById('statRevenue').innerText = 'KES ' + todayRevenue;
    }

    async function loadVisits() {
      try {
        const response = await fetch('/api/visits');
        if (handleAuthError(response)) return;
        const data = await response.json();
        if (data.success) document.getElementById('statVisits').innerText = data.uniqueToday;
      } catch (error) { console.error(error); }
    }

    function setFilter(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); currentFilter = btn.dataset.filter; applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('searchBox').value.toLowerCase().trim();
      container.innerHTML = '';
      const filtered = allOrders.filter(o => {
        if (currentFilter !== 'All' && o.status !== currentFilter) return false;
        if (search) {
          return (o.customerName||'').toLowerCase().includes(search) || 
                 (o.phone||'').toLowerCase().includes(search) || 
                 (o.shopName||'').toLowerCase().includes(search);
        }
        return true;
      });
      if (filtered.length === 0) { container.innerHTML = "<p class='no-orders'>No orders match your filter.</p>"; return; }
      filtered.forEach(order => renderOrder(order));
    }

    function renderOrder(order) {
      const statusClass = (order.status || 'Pending').replace(/\s/g, '');
      const waPhone = formatPhoneForWhatsApp(order.phone);
      let mapLink = '';
      if (order.latitude && order.longitude) mapLink = `<a class="map-link" target="_blank" href="https://www.google.com/maps?q=${order.latitude},${order.longitude}">📍 Open Map</a>`;
      
      const waConfirm = `https://wa.me/${waPhone}?text=${encodeURIComponent(buildWhatsAppMessage(order, 'confirm'))}`;
      const waOut = `https://wa.me/${waPhone}?text=${encodeURIComponent(buildWhatsAppMessage(order, 'out'))}`;
      const waDeliv = `https://wa.me/${waPhone}?text=${encodeURIComponent(buildWhatsAppMessage(order, 'delivered'))}`;
      const ref = order._id.slice(-6).toUpperCase();
      
      const card = document.createElement('div');
      card.className = `order-card ${statusClass}`;
      card.id = `order-${order._id}`;
      card.innerHTML = `
        <div>
          <div class="ref">Order #${ref} • ${new Date(order.createdAt).toLocaleString('en-KE', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
          <div class="customer">${order.customerName}</div>
          <div class="row">📞 ${order.phone}</div>
          <div class="row">🏠 ${order.hostel}, Room ${order.room}</div>
          ${mapLink ? `<div class="row">${mapLink}</div>` : ''}
          <div class="divider"></div>
          <div class="row">📦 ${order.itemDescription}</div>
          <div class="row">💰 Goods: <b>KES ${order.goodsAmount}</b></div>
          <div class="row">🚚 Fee: KES ${order.deliveryFee}</div>
          <div class="row" style="margin-top:8px;"><span class="status ${statusClass}">${order.status}</span></div>
        </div>
        <div class="action-buttons">
          <a href="${waConfirm}" target="_blank" style="text-decoration:none;"><button class="btn-whatsapp">📱 Confirm</button></a>
          <a href="${waOut}" target="_blank" style="text-decoration:none;"><button class="btn-whatsapp">🛵 Out for Delivery</button></a>
          <a href="${waDeliv}" target="_blank" style="text-decoration:none;"><button class="btn-whatsapp">✅ Delivered</button></a>
          <button class="btn-out" onclick="updateStatus('${order._id}', 'Out for Delivery')">🚚 Mark: Out</button>
          <button class="btn-deliver" onclick="updateStatus('${order._id}', 'Delivered')">✅ Mark: Delivered</button>
          <button class="btn-delete" onclick="deleteOrder('${order._id}')">🗑️ Delete</button>
        </div>
      `;
      container.appendChild(card);
    }

    async function updateStatus(orderId, newStatus) {
      try {
        const response = await fetch(`/api/orders/${orderId}/status`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: newStatus }) });
        if (handleAuthError(response)) return;
      } catch (error) { alert("Failed to update status."); }
    }

    async function deleteOrder(orderId) {
      if (!confirm("Delete this order permanently?")) return;
      try {
        const response = await fetch(`/api/orders/${orderId}`, { method: 'DELETE' });
        if (handleAuthError(response)) return;
        const data = await response.json();
        if (data.success) { allOrders = allOrders.filter(o => o._id !== orderId); document.getElementById(`order-${orderId}`).remove(); updateStats(); }
      } catch (error) { alert("Network error."); }
    }

    async function logout() {
      if (!confirm("Log out?")) return;
      try { await fetch('/api/logout', { method: 'POST' }); } finally { window.location.href = '/login.html'; }
    }

    socket.on('new-order', (order) => { allOrders.unshift(order); updateStats(); applyFilters(); loadVisits(); });
    socket.on('order-updated', (updatedOrder) => {
      const idx = allOrders.findIndex(o => o._id === updatedOrder._id);
      if (idx !== -1) allOrders[idx] = updatedOrder;
      updateStats(); applyFilters();
    });
    socket.on('order-deleted', (orderId) => {
      allOrders = allOrders.filter(o => o._id !== orderId); updateStats(); applyFilters();
    });

    loadOrders(); loadVisits(); loadFeaturedItems();
    setInterval(loadVisits, 60000);
  </script>
</body>
</html>
