<!DOCTYPE html>
<html>
<head>
  <title>Columbus Delivery - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; margin: 0; padding: 10px; background: #f0f2f5; color: #333; }
    .header { background: #0d2b45; color: white; padding: 12px 15px; text-align: center; font-size: 18px; font-weight: bold; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .status-badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; background: #27ae60; color: white; }
    .logout-btn { background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
    
    /* Stats Cards — 2x2 grid */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat-card { background: white; border-radius: 10px; padding: 12px 10px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .stat-card .num { font-size: 20px; font-weight: 700; color: #0d2b45; }
    .stat-card .lbl { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .stat-card.green .num { color: #27ae60; }
    .stat-card.orange .num { color: #f39c12; }
    
    /* Search + Filters */
    .search-box { width: 100%; padding: 10px 12px; border: 1.5px solid #e0e0e8; border-radius: 10px; font-size: 14px; margin-bottom: 8px; background: white; }
    .search-box:focus { outline: none; border-color: #0d2b45; }
    .filters { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .filter-btn { padding: 6px 12px; border: 1.5px solid #ddd; background: white; border-radius: 20px; font-size: 12px; font-weight: 600; color: #555; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: #0d2b45; color: white; border-color: #0d2b45; }
    
    #ordersContainer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .order-card { background: white; border-radius: 10px; padding: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border-top: 4px solid #f39c12; font-size: 12px; display: flex; flex-direction: column; justify-content: space-between; }
    .order-card.paid { border-top-color: #27ae60; }
    .order-card.failed { border-top-color: #e74c3c; }
    .order-card.OutforDelivery { border-top-color: #3498db; }
    .order-card.Delivered { border-top-color: #8e44ad; }
    .row { margin-bottom: 3px; line-height: 1.35; }
    .label { font-weight: bold; color: #555; }
    
    .status { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; color: white; }
    .status.Pending { background-color: #f39c12; }
    .status.Paid { background-color: #27ae60; }
    .status.Failed { background-color: #e74c3c; }
    .status.OutforDelivery { background-color: #3498db; }
    .status.Delivered { background-color: #8e44ad; }
    
    .map-link { display: inline-block; background: #4285f4; color: white !important; text-decoration: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-top: 4px; margin-right: 4px; }
    
    .action-buttons { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .action-buttons button { padding: 6px; border: none; border-radius: 5px; color: white; font-size: 10px; font-weight: bold; cursor: pointer; width: 100%; }
    .action-buttons button:active { transform: scale(0.97); }
    .btn-whatsapp { background-color: #25d366; }
    .btn-out { background-color: #3498db; }
    .btn-deliver { background-color: #8e44ad; }
    .btn-delete { background-color: #e74c3c; }
    
    .no-orders { text-align: center; grid-column: span 2; padding: 30px; color: #777; background: white; border-radius: 10px; }
    
    @media (max-width: 350px) {
      #ordersContainer { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    🛵 Admin Dashboard
    <div style="display: flex; gap: 8px; align-items: center;">
      <span class="status-badge">● Live</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="num" id="statToday">0</div>
      <div class="lbl">Orders Today</div>
    </div>
    <div class="stat-card orange">
      <div class="num" id="statPending">0</div>
      <div class="lbl">Pending</div>
    </div>
    <div class="stat-card green">
      <div class="num" id="statRevenue">KES 0</div>
      <div class="lbl">Today Fees</div>
    </div>
    <div class="stat-card" style="background: linear-gradient(135deg, #e8f0fe, #d4e4fc);">
      <div class="num" id="statVisits">0</div>
      <div class="lbl">👀 Visitors Today</div>
    </div>
  </div>

  <!-- Search + Filters -->
  <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search by name, phone or shop..." oninput="applyFilters()">
  <div class="filters">
    <button class="filter-btn active" data-filter="All" onclick="setFilter(this)">All</button>
    <button class="filter-btn" data-filter="Pending" onclick="setFilter(this)">🟠 Pending</button>
    <button class="filter-btn" data-filter="Paid" onclick="setFilter(this)">🟢 Paid</button>
    <button class="filter-btn" data-filter="OutforDelivery" onclick="setFilter(this)">🚚 Out</button>
    <button class="filter-btn" data-filter="Delivered" onclick="setFilter(this)">✅ Delivered</button>
    <button class="filter-btn" data-filter="Failed" onclick="setFilter(this)">🔴 Failed</button>
  </div>

  <div id="ordersContainer">Loading orders...</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const container = document.getElementById('ordersContainer');
    let allOrders = [];
    let currentFilter = 'All';

    function handleAuthError(response) {
      if (response.status === 401) { window.location.href = '/login.html'; return true; }
      return false;
    }

    function formatPhoneForWhatsApp(phone) {
      let p = String(phone).replace(/\D/g, '');
      if (p.startsWith('0')) p = '254' + p.substring(1);
      else if (p.startsWith('254')) { /* ok */ }
      else if (p.length === 9) p = '254' + p;
      return p;
    }

    function buildWhatsAppMessage(order, type) {
      const ref = order._id.slice(-6);
      const goodsTotal = order.goodsAmount * order.quantity;
      if (type === 'confirm') return `Hi ${order.customerName}! 👋\n\nYour order #${ref} has been received by Columbus Delivery.\n\n📦 Item: ${order.itemDescription} (x${order.quantity})\n🏪 Shop: ${order.shopName}\n💰 Goods: KES ${goodsTotal} (pay on delivery)\n🚚 Delivery Fee: KES ${order.deliveryFee} (paid ✅)\n\nWe're processing your order now!`;
      if (type === 'out') return `Hi ${order.customerName}! 🛵\n\nYour order #${ref} is OUT FOR DELIVERY!\n\nOur rider is on the way to ${order.hostel}, Room ${order.room}.\n\nPlease have KES ${goodsTotal} ready for the goods. 💰`;
      if (type === 'delivered') return `Hi ${order.customerName}! ✅\n\nYour order #${ref} has been delivered.\n\nThank you for choosing Columbus Delivery! 🛵`;
      return `Hi ${order.customerName}, about your order #${ref}...`;
    }

    // ================================
    // LOAD ORDERS
    // ================================
    async function loadOrders() {
      try {
        const response = await fetch('/api/orders');
        if (handleAuthError(response)) return;
        const data = await response.json();
        if (data.success) {
          allOrders = data.orders;
          updateStats();
          applyFilters();
        }
      } catch (error) {
        container.innerHTML = "<p class='no-orders'>Network error.</p>";
      }
    }

    // ================================
    // STATS
    // ================================
    function updateStats() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      let todayCount = 0;
      let pendingCount = 0;
      let todayRevenue = 0;

      allOrders.forEach(o => {
        const orderDate = new Date(o.createdAt);
        if (orderDate >= today) {
          todayCount++;
          if (o.status === 'Paid' || o.status === 'Out for Delivery' || o.status === 'Delivered') {
            todayRevenue += o.deliveryFee || 0;
          }
        }
        if (o.status === 'Pending' || o.status === 'Paid') pendingCount++;
      });

      document.getElementById('statToday').innerText = todayCount;
      document.getElementById('statPending').innerText = pendingCount;
      document.getElementById('statRevenue').innerText = 'KES ' + todayRevenue;
    }

    // ================================
    // LOAD VISITOR STATS
    // ================================
    async function loadVisits() {
      try {
        const response = await fetch('/api/visits');
        if (handleAuthError(response)) return;
        const data = await response.json();
        if (data.success) {
          const visitsEl = document.getElementById('statVisits');
          visitsEl.innerText = data.uniqueToday;
          visitsEl.title = `Today: ${data.todayVisits} views (${data.uniqueToday} unique) | All-time: ${data.totalVisits} views (${data.uniqueTotal} unique)`;
        }
      } catch (error) {
        console.error('Could not load visits:', error);
      }
    }

    // ================================
    // FILTERS
    // ================================
    function setFilter(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('searchBox').value.toLowerCase().trim();
      container.innerHTML = '';

      const filtered = allOrders.filter(o => {
        if (currentFilter !== 'All' && o.status !== currentFilter) return false;
        if (search) {
          const nameMatch = (o.customerName || '').toLowerCase().includes(search);
          const phoneMatch = (o.phone || '').toLowerCase().includes(search);
          const shopMatch = (o.shopName || '').toLowerCase().includes(search);
          if (!nameMatch && !phoneMatch && !shopMatch) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = "<p class='no-orders'>No orders match your filter.</p>";
        return;
      }

      filtered.forEach(order => renderOrder(order));
    }

    // ================================
    // RENDER ORDER CARD
    // ================================
    function renderOrder(order) {
      const statusClass = order.status || 'Pending';
      const cardClass = statusClass.replace(/\s/g, '');
      
      const waPhone = formatPhoneForWhatsApp(order.phone);
      
      let mapLink = '';
      if (order.latitude && order.longitude) {
        mapLink = `<a class="map-link" target="_blank" href="https://www.google.com/maps?q=${order.latitude},${order.longitude}">📍 Map</a>`;
      }
      
      const waConfirmUrl = `https://wa.me/${waPhone}?text=${encodeURIComponent(buildWhatsAppMessage(order, 'confirm'))}`;
      const waOutUrl = `https://wa.me/${waPhone}?text=${encodeURIComponent(buildWhatsAppMessage(order, 'out'))}`;
      const waDeliveredUrl = `https://wa.me/${waPhone}?text=${encodeURIComponent(buildWhatsAppMessage(order, 'delivered'))}`;
      
      const card = document.createElement('div');
      card.className = `order-card ${cardClass}`;
      card.id = `order-${order._id}`;
      card.innerHTML = `
        <div>
          <div class="row"><b>${order.customerName}</b></div>
          <div class="row">📞 ${order.phone}</div>
          <div class="row">🏠 ${order.hostel}, Rm ${order.room}</div>
          <div class="row">🏪 ${order.shopName}</div>
          <div class="row">📦 ${order.itemDescription} (x${order.quantity})</div>
          <div class="row">💰 Goods: KES ${order.goodsAmount * order.quantity}</div>
          <div class="row">🚚 Fee: KES ${order.deliveryFee}</div>
          ${order.locationPin ? `<div class="row">📝 ${order.locationPin}</div>` : ''}
          ${mapLink}
          <div class="row" style="margin-top:5px;"><span class="status ${statusClass}">${statusClass}</span></div>
        </div>
        <div class="action-buttons">
          <a href="${waConfirmUrl}" target="_blank" style="text-decoration:none;"><button class="btn-whatsapp">📱 Confirm Order</button></a>
          <a href="${waOutUrl}" target="_blank" style="text-decoration:none;"><button class="btn-whatsapp">🛵 Out for Delivery</button></a>
          <a href="${waDeliveredUrl}" target="_blank" style="text-decoration:none;"><button class="btn-whatsapp">✅ Delivered</button></a>
          <button class="btn-out" onclick="updateStatus('${order._id}', 'Out for Delivery')">🚚 Mark: Out</button>
          <button class="btn-deliver" onclick="updateStatus('${order._id}', 'Delivered')">✅ Mark: Delivered</button>
          <button class="btn-delete" onclick="deleteOrder('${order._id}')">🗑️ Delete</button>
        </div>
      `;
      container.appendChild(card);
    }

    // ================================
    // ACTIONS
    // ================================
    async function updateStatus(orderId, newStatus) {
      try {
        const response = await fetch(`/api/orders/${orderId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (handleAuthError(response)) return;
      } catch (error) { alert("Failed to update status."); }
    }

    async function deleteOrder(orderId) {
      if (!confirm("Are you sure you want to delete this order permanently?")) return;
      try {
        const response = await fetch(`/api/orders/${orderId}`, { method: 'DELETE' });
        if (handleAuthError(response)) return;
        const data = await response.json();
        if (data.success) {
          allOrders = allOrders.filter(o => o._id !== orderId);
          const card = document.getElementById(`order-${orderId}`);
          if (card) card.remove();
          updateStats();
        } else { alert("Failed to delete order."); }
      } catch (error) { alert("Network error."); }
    }

    async function logout() {
      if (!confirm("Are you sure you want to logout?")) return;
      try { await fetch('/api/logout', { method: 'POST' }); } finally { window.location.href = '/login.html'; }
    }

    // ================================
    // REAL-TIME
    // ================================
    socket.on('new-order', (order) => {
      allOrders.unshift(order);
      updateStats();
      applyFilters();
      loadVisits();
    });

    socket.on('order-updated', (updatedOrder) => {
      const idx = allOrders.findIndex(o => o._id === updatedOrder._id);
      if (idx !== -1) allOrders[idx] = updatedOrder;
      updateStats();
      applyFilters();
    });

    socket.on('order-deleted', (orderId) => {
      allOrders = allOrders.filter(o => o._id !== orderId);
      updateStats();
      applyFilters();
    });

    // ================================
    // INIT
    // ================================
    loadOrders();
    loadVisits();

    // Refresh visitor stats every 60 seconds
    setInterval(loadVisits, 60000);
  </script>
</body>
</html>
