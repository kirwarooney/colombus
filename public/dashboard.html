<!DOCTYPE html>
<html>
<head>
  <title>Columbus Delivery - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #efeae2; background-image: radial-gradient(rgba(11, 20, 26, 0.05) 1px, transparent 1px); background-size: 20px 20px; min-height: 100vh; color: #111b21; padding-bottom: 40px; }

    /* ===== Header (WhatsApp green top bar) ===== */
    .header { background: #008069; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(11, 20, 26, 0.3); }
    .header-title { font-size: 20px; font-weight: 600; }
    .header-title span { color: #d9fdd3; font-weight: 400; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .live-dot { display: inline-block; width: 8px; height: 8px; background: #25d366; border-radius: 50%; margin-right: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-badge { font-size: 12px; font-weight: 500; margin-right: 4px; opacity: 0.95; }
    .btn-icon { display: inline-block; background: rgba(255, 255, 255, 0.14); border: none; color: #fff; padding: 7px 13px; border-radius: 18px; font-size: 13px; cursor: pointer; text-decoration: none; font-family: inherit; }
    .btn-icon:hover { background: rgba(255, 255, 255, 0.26); color: #fff; }

    /* ===== Stats ===== */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 12px; max-width: 700px; margin: 0 auto; }
    .stat-card { background: #fff; border-radius: 12px; padding: 14px; text-align: left; box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13); border-left: 4px solid #00a884; }
    .stat-card .num { font-size: 24px; font-weight: 600; color: #111b21; }
    .stat-card .lbl { font-size: 12px; color: #667781; margin-top: 3px; }
    .stat-card.green .num { color: #00a884; }
    .stat-card.orange { border-left-color: #f5a623; }
    .stat-card.orange .num { color: #d98a00; }
    .stat-card.blue { border-left-color: #53bdeb; }
    .stat-card.blue .num { color: #027eb5; }

    /* ===== Manage Items ===== */
    .manage-items { background: #fff; width: calc(100% - 24px); max-width: 676px; margin: 0 auto 14px; border-radius: 12px; padding: 16px; box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13); }
    .manage-items h3 { color: #008069; font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    .item-input-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #e9edef; }
    .item-input-row input[type="text"] { padding: 11px 15px; border: none; background: #f0f2f5; border-radius: 20px; font-size: 14px; font-family: inherit; color: #111b21; width: 100%; }
    .item-input-row input[type="text"]:focus { outline: none; box-shadow: 0 0 0 2px #00a884; background: #fff; }
    .img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #e9edef; display: none; margin-top: 5px; }
    .btn-save-items { width: 100%; background: #00a884; color: white; border: none; padding: 12px; border-radius: 22px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit; font-size: 15px; }
    .btn-save-items:hover { background: #008069; }

    /* ===== Search + filter chips ===== */
    .controls { padding: 0 12px 12px; max-width: 700px; margin: 0 auto; }
    .search-box { width: 100%; padding: 12px 18px; border: none; border-radius: 24px; font-size: 15px; background: #fff; font-family: inherit; color: #111b21; margin-bottom: 10px; box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13); }
    .search-box:focus { outline: none; box-shadow: 0 0 0 2px #00a884; }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn { padding: 7px 15px; border: 1px solid #e9edef; background: #fff; border-radius: 18px; font-size: 13px; font-weight: 500; color: #54656f; cursor: pointer; white-space: nowrap; font-family: inherit; }
    .filter-btn.active { background: #d9fdd3; color: #005c4b; border-color: #d9fdd3; }

    /* ===== Orders as chat bubbles ===== */
    #ordersContainer { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 0 12px 20px; max-width: 700px; margin: 0 auto; }
    .order-card { background: #fff; border-radius: 0 12px 12px 12px; padding: 12px 14px; box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13); border-left: 4px solid #f5a623; font-size: 13px; display: flex; flex-direction: column; justify-content: space-between; }
    .order-card.Paid { border-left-color: #00a884; background: #d9fdd3; }
    .order-card.Failed { border-left-color: #ea0038; }
    .order-card.OutforDelivery { border-left-color: #027eb5; }
    .order-card.Delivered { border-left-color: #075e54; }
    .order-card .ref { font-size: 11px; color: #667781; font-family: inherit; margin-bottom: 6px; }
    .order-card .customer { font-size: 15px; font-weight: 600; color: #008069; margin-bottom: 4px; font-family: inherit; }
    .order-card .row { margin-bottom: 4px; line-height: 1.45; color: #3b4a54; font-family: inherit; }
    .order-card .row b { color: #111b21; }
    .order-card .divider { height: 1px; background: rgba(11, 20, 26, 0.09); margin: 8px 0; }

    .status { display: inline-block; padding: 3px 11px; border-radius: 12px; font-size: 11px; font-weight: 600; color: #fff; font-family: inherit; }
    .status.Pending { background-color: #d98a00; }
    .status.Paid { background-color: #00a884; }
    .status.Failed { background-color: #ea0038; }
    .status.OutforDelivery { background-color: #027eb5; }
    .status.Delivered { background-color: #075e54; }

    .map-link { display: inline-block; background: #027eb5; color: #fff !important; text-decoration: none; padding: 6px 12px; border-radius: 14px; font-size: 12px; font-weight: 600; margin-top: 4px; font-family: inherit; }

    .action-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .action-buttons button { padding: 10px 12px; border: none; border-radius: 20px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; font-family: inherit; transition: 0.2s; }
    .action-buttons button:hover { opacity: 0.9; }
    .btn-whatsapp { background: #00a884; }
    .btn-out { background: #027eb5; }
    .btn-deliver { background: #075e54; }
    .btn-delete { background: #ea0038; }
    .no-orders { text-align: center; grid-column: 1 / -1; padding: 40px; color: #667781; background: #fff; border-radius: 12px; font-family: inherit; }
    @media (min-width: 640px) { #ordersContainer { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">Columbus <span>Admin</span></div>
    <div class="header-actions">
      <span class="status-badge"><span class="live-dot"></span>Live</span>
      <a href="/settings.html" class="btn-icon">⚙️</a>
      <button class="btn-icon" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="num" id="statToday">0</div><div class="lbl">Orders Today</div></div>
    <div class="stat-card orange"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div>
    <div class="stat-card green"><div class="num" id="statRevenue">KES 0</div><div class="lbl">Today Fees</div></div>
    <div class="stat-card blue"><div class="num" id="statVisits">0</div><div class="lbl">👀 Visitors Today</div></div>
  </div>

  <div class="manage-items">
    <h3>🖼️ Manage Homepage Items (Max 5)</h3>
    <div style="font-size: 12px; color: #666; margin-bottom: 15px; font-family: Arial, sans-serif;">
      Paste an image link (URL) from Google Images, Imgur, or any website. The preview will show below.
    </div>
    <div id="featuredItemsContainer"></div>
    <button class="btn-save-items" onclick="saveFeaturedItems()">Save Homepage Items</button>
    <div id="saveStatus" style="text-align:center; font-size:12px; color:green; margin-top:8px; font-weight:bold;"></div>
  </div>

  <div class="controls">
    <input type="text" class="search-box" id="searchBox" placeholder="Search by name, phone, shop..." oninput="applyFilters()">
    <div class="filters">
      <button class="filter-btn active" data-filter="All" onclick="setFilter(this)">All</button>
      <button class="filter-btn" data-filter="Pending" onclick="setFilter(this)">Pending</button>
      <button class="filter-btn" data-filter="Paid" onclick="setFilter(this)">Paid</button>
      <button class="filter-btn" data-filter="OutforDelivery" onclick="setFilter(this)">Out</button>
      <button class="filter-btn" data-filter="Delivered" onclick="setFilter(this)">Delivered</button>
      <button class="filter-btn" data-filter="Failed" onclick="setFilter(this)">Failed</button>
    </div>
  </div>

  <div id="ordersContainer">Loading orders...</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const container = document.getElementById('ordersContainer');
    let allOrders = [];
    let currentFilter = 'All';

    // --- FEATURED ITEMS & URL LOGIC ---
    async function loadFeaturedItems() {
      try {
        const res = await fetch('/api/settings');
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        const data = await res.json();
        
        let items = data.settings?.featuredItems || [];
        while (items.length < 5) items.push({ imageUrl: '', name: '' });

        const container = document.getElementById('featuredItemsContainer');
        container.innerHTML = '';
        
        items.slice(0, 5).forEach((item, i) => {
          container.innerHTML += `
            <div class="item-input-row">
              <input type="text" id="itemName${i}" placeholder="Item Name (e.g. Chapati)" value="${item.name || ''}">
              
              <input type="text" id="itemImgUrl${i}" placeholder="Paste Image URL here (https://...)" value="${item.imageUrl || ''}" oninput="updatePreview(${i})">
              
              <img id="preview${i}" src="${item.imageUrl || ''}" class="img-preview" style="${item.imageUrl ? 'display:block;' : ''}" onerror="this.style.display='none'">
            </div>
          `;
        });
      } catch (e) { console.error(e); }
    }

    // Live preview when pasting a URL
    function updatePreview(index) {
      const url = document.getElementById(`itemImgUrl${index}`).value.trim();
      const preview = document.getElementById(`preview${index}`);
      if (url) {
        preview.src = url;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    }

    async function saveFeaturedItems() {
      const status = document.getElementById('saveStatus');
      status.innerText = "Saving...";
      status.style.color = "blue";

      const newItems = [];
      for (let i = 0; i < 5; i++) {
        const name = document.getElementById(`itemName${i}`).value.trim();
        const imgUrl = document.getElementById(`itemImgUrl${i}`).value.trim();
        if (name && imgUrl) {
          newItems.push({ name: name, imageUrl: imgUrl });
        }
      }

      try {
        const res = await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ featuredItems: newItems })
        });
        
        if (!res.ok) throw new Error("Failed to save to database");

        status.innerText = "✅ Saved successfully! Open homepage to see changes.";
        status.style.color = "green";
        setTimeout(() => status.innerText = "", 4000);
        
      } catch (error) {
        status.innerText = "❌ " + error.message;
        status.style.color = "red";
      }
    }

    // --- ORDER LOGIC ---
    function handleAuthError(response) {
      if (response.status === 401) { window.location.href = '/login.html'; return true; }
      return false;
    }

    function formatPhoneForWhatsApp(phone) {
      let p = String(phone).replace(/\D/g, '');
      if (p.startsWith('0')) p = '254' + p.substring(1);
      else if (p.startsWith('254')) {}
      else if (p.length === 9) p = '254' + p;
      return p;
    }

    function buildWhatsAppMessage(order, type) {
      const ref = order._id.slice(-6);
      const goodsTotal = order.goodsAmount;
      if (type === 'confirm') return `Hi ${order.customerName}! 👋\n\nYour order #${ref} has been received by Columbus Delivery.\n\n📦 Item: ${order.itemDescription}\n💰 Goods: KES ${goodsTotal}\n🚚 Delivery Fee: KES ${order.deliveryFee} (paid ✅)`;
      if (type === 'out') return `Hi ${order.customerName}! 🛵\n\nYour order #${ref} is OUT FOR DELIVERY!\n\nPlease have KES ${goodsTotal} ready for the goods. 💰`;
      if (type === 'delivered') return `Hi ${order.customerName}! ✅\n\nYour order #${ref} has been delivered.\n\nThank you! 🛵`;
      return `Hi ${order.customerName}, about your order #${ref}...`;
    }

    async function loadOrders() {
      try {
        const response = await fetch('/api/orders');
        if (handleAuthError(response)) return;
        const data = await response.json();
        if (data.success) { allOrders = data.orders; updateStats(); applyFilters(); }
      } catch (error) { container.innerHTML = "<p class='no-orders'>Network error.</p>"; }
    }

    function updateStats() {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      let todayCount = 0; let pendingCount = 0; let todayRevenue = 0;
      allOrders.forEach(o => {
        if (new Date(o.createdAt) >= today) {
          todayCount++;
          if (['Paid', 'Out for Delivery', 'Delivered'].includes(o.status)) todayRevenue += o.deliveryFee || 0;
        }
        if (['Pending', 'Paid'].includes(o.status)) pendingCount++;
      });
      document.getElementById('statToday').innerText = todayCount;
      document.getElementById('statPending').innerText = pendingCount;
      document.getElementById('statRevenue').innerText = 'KES ' + todayRevenue;
    }

    async function loadVisits() {
      try {
        const response = await fetch('/api/visits');
        if (handleAuthError(response)) return;
        const data = await response.json();
        if (data.success) document.getElementById('statVisits').innerText = data.uniqueToday;
      } catch (error) { console.error(error); }
    }

    function setFilter(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); currentFilter = btn.dataset.filter; applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('searchBox').value.toLowerCase().trim();
      container.innerHTML = '';
      const filtered = allOrders.filter(o => {
        if (currentFilter !== 'All' && o.status !== currentFilter) return false;
        if (search) {
          return (o.customerName||'').toLowerCase().includes(search) || 
                 (o.phone||'').toLowerCase().includes(search) || 
                 (o.shopName||'').toLowerCase().includes(search);
        }
        return true;
      });
      if (filtered.length === 0) { container.innerHTML = "<p class='no-orders'>No orders match your filter.</p>"; return; }
      filtered.forEach(order => renderOrder(order));
    }

    function renderOrder(order) {
      const statusClass = (order.status || 'Pending').replace(/\s/g, '');
      const waPhone = formatPhoneForWhatsApp(order.phone);
      let mapLink = '';
      if (order.latitude && order.longitude) mapLink = `<a class="map-link" target="_blank" href="https://www.google.com/maps?q=${order.latitude},${order.longitude}">📍 Open Map</a>`;
      
      const waConfirm = `https://wa.me/${waPhone}?text=${encodeURIComponent(buildWhatsAppMessage(order, 'confirm'))}`;
      const waOut = `https://wa.me/${waPhone}?text=${encodeURIComponent(buildWhatsAppMessage(order, 'out'))}`;
      const waDeliv = `https://wa.me/${waPhone}?text=${encodeURIComponent(buildWhatsAppMessage(order, 'delivered'))}`;
      const ref = order._id.slice(-6).toUpperCase();
      
      const card = document.createElement('div');
      card.className = `order-card ${statusClass}`;
      card.id = `order-${order._id}`;
      card.innerHTML = `
        <div>
          <div class="ref">Order #${ref} • ${new Date(order.createdAt).toLocaleString('en-KE', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
          <div class="customer">${order.customerName}</div>
          <div class="row">📞 ${order.phone}</div>
          <div class="row">🏠 ${order.hostel}, Room ${order.room}</div>
          ${mapLink ? `<div class="row">${mapLink}</div>` : ''}
          <div class="divider"></div>
          <div class="row">📦 ${order.itemDescription}</div>
          <div class="row">💰 Goods: <b>KES ${order.goodsAmount}</b></div>
          <div class="row">🚚 Fee: KES ${order.deliveryFee}</div>
          <div class="row" style="margin-top:8px;"><span class="status ${statusClass}">${order.status}</span></div>
        </div>
        <div class="action-buttons">
          <a href="${waConfirm}" target="_blank" style="text-decoration:none;"><button class="btn-whatsapp">📱 Confirm</button></a>
          <a href="${waOut}" target="_blank" style="text-decoration:none;"><button class="btn-whatsapp">🛵 Out for Delivery</button></a>
          <a href="${waDeliv}" target="_blank" style="text-decoration:none;"><button class="btn-whatsapp">✅ Delivered</button></a>
          <button class="btn-out" onclick="updateStatus('${order._id}', 'Out for Delivery')">🚚 Mark: Out</button>
          <button class="btn-deliver" onclick="updateStatus('${order._id}', 'Delivered')">✅ Mark: Delivered</button>
          <button class="btn-delete" onclick="deleteOrder('${order._id}')">🗑️ Delete</button>
        </div>
      `;
      container.appendChild(card);
    }

    async function updateStatus(orderId, newStatus) {
      try {
        const response = await fetch(`/api/orders/${orderId}/status`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: newStatus }) });
        if (handleAuthError(response)) return;
      } catch (error) { alert("Failed to update status."); }
    }

    async function deleteOrder(orderId) {
      if (!confirm("Delete this order permanently?")) return;
      try {
        const response = await fetch(`/api/orders/${orderId}`, { method: 'DELETE' });
        if (handleAuthError(response)) return;
        const data = await response.json();
        if (data.success) { allOrders = allOrders.filter(o => o._id !== orderId); document.getElementById(`order-${orderId}`).remove(); updateStats(); }
      } catch (error) { alert("Network error."); }
    }

    async function logout() {
      if (!confirm("Log out?")) return;
      try { await fetch('/api/logout', { method: 'POST' }); } finally { window.location.href = '/login.html'; }
    }

    socket.on('new-order', (order) => { allOrders.unshift(order); updateStats(); applyFilters(); loadVisits(); });
    socket.on('order-updated', (updatedOrder) => {
      const idx = allOrders.findIndex(o => o._id === updatedOrder._id);
      if (idx !== -1) allOrders[idx] = updatedOrder;
      updateStats(); applyFilters();
    });
    socket.on('order-deleted', (orderId) => {
      allOrders = allOrders.filter(o => o._id !== orderId); updateStats(); applyFilters();
    });

    loadOrders(); loadVisits(); loadFeaturedItems();
    setInterval(loadVisits, 60000);
  </script>
</body>
</html>
